name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out app
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: then-app

      - name: Check out OpenAPI owner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: StephenQiu30/then-server
          ref: 14a0e8a3ec5d7aa48f8dd19e3ac59bc138400899
          path: then-server

      - name: Verify toolchain and contract
        working-directory: then-app
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -F 'Xcode 26.6'
          swift --version | grep -F 'Apple Swift version 6.3.3'
          test -L ThenApp/openapi.yaml
          test "$(readlink ThenApp/openapi.yaml)" = '../../then-server/backend/openapi.yaml'
          test -s ThenApp/openapi.yaml

      - name: Resolve packages
        working-directory: then-app
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ThenApp.xcodeproj \
            -scheme ThenApp

      - name: Build Debug app
        working-directory: then-app
        run: |
          xcodebuild -project ThenApp.xcodeproj \
            -scheme ThenApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            clean build

      - name: Test simulator-compatible suites
        working-directory: then-app
        run: |
          xcodebuild -project ThenApp.xcodeproj \
            -scheme ThenApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -skipPackagePluginValidation \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO \
            -skip-testing:ThenAppUITests \
            -skip-testing:ThenAppTests/VisionWardrobePersonAnalyzerTests \
            -skip-testing:ThenAppTests/WardrobeVisionProbeTests \
            -resultBundlePath "$RUNNER_TEMP/ThenAppTests.xcresult" \
            test

      - name: Report test result
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/ThenAppTests.xcresult" ]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/ThenAppTests.xcresult"
          fi
